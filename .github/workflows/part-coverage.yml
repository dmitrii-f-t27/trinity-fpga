# Can each part still route the simplest possible design?
#
# openXC7/nextpnr-xilinx#154: xc7a35t cannot route a three-line flip-flop,
# while xc7a200t builds the identical design. Nobody noticed, because no CI job
# builds anything on xc7a35t — the upstream `demos` workflow is the only gate
# there, and a part nothing exercises can regress to totally broken without a
# single red run.
#
# This is the gate that would have caught it on the day it appeared.
#
# ONE design, deliberately trivial:
#
#     module top (input wire clk, input wire d, output reg q);
#         always @(posedge clk) q <= d;
#     endmodule
#
# Trivial because its failures are unambiguous. A demo that fails could be the
# demo; a flip-flop that fails is the part or the tool.
#
# Through fasm2frames, not stopping at place-and-route. openXC7#149 has a design
# that places and routes cleanly and then has no bitstream at all —
# FasmLookupError at assembly — so "P&R succeeded" is not "a bitstream exists".
#
# THE GATE'S OWN ACCEPTANCE TEST, checked in the last step:
#
#     xc7a35tcsg324-1   must FAIL     (reproduces #154)
#     xc7a200tfbg484-2  must PASS     (the control)
#
# If those two invert or both agree, this workflow is broken and says so rather
# than reporting on the parts. A new gate that cannot reproduce the defect that
# motivated it is not evidence of anything.
#
# ON THE PART LIST. Upstream's demos workflow names xc7a35tcsg324-1,
# xc7k325tffg676-1, xc7s50csga324-1 and xc7z035. Only two parts are here,
# because a part needs pin assignments and I have verified pins for exactly
# these two — a35t from prjxray's own arty-a7 harness, a200t from the control
# run in openXC7#154. Guessing pins for the other three would produce failures
# that are mine rather than the tool's, which is the failure mode that made the
# first version of the #154 reducer useless. Add a part when its pins are
# confirmed, not before.
#
# phi^2 + 1/phi^2 = 3 = TRINITY

name: part coverage — can each part route a flip-flop?

on:
  workflow_dispatch:
  schedule:
    - cron: '37 4 * * *'

env:
  OPENXC7_IMAGE: regymm/openxc7@sha256:eced1cdd4727549f2d983328e0cf170fb6f6f67d87f19b2bf24365163368c70c

jobs:
  part:
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: xc7a35tcsg324-1
            device: xc7a35tcsg324
            clk: E3
            d: A8
            q: H5
            expect: fail        # openXC7#154
          - part: xc7a200tfbg484-2
            device: xc7a200tfbg484
            clk: U22
            d: F21
            q: M22
            expect: pass        # the control
    name: ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Pull the pinned image
        run: |
          for i in 1 2 3 4 5 6; do docker pull "$OPENXC7_IMAGE" && break; sleep $((i*20)); done

      - name: The design and its pins
        run: |
          mkdir -p work out
          cat > work/top.v <<'EOF'
          module top (input wire clk, input wire d, output reg q);
              always @(posedge clk) q <= d;
          endmodule
          EOF
          cat > work/top.xdc <<EOF
          set_property PACKAGE_PIN ${{ matrix.clk }} [get_ports clk]
          set_property IOSTANDARD LVCMOS33 [get_ports clk]
          create_clock -period 10.000 -name sys_clk [get_ports clk]
          set_property PACKAGE_PIN ${{ matrix.d }} [get_ports d]
          set_property IOSTANDARD LVCMOS33 [get_ports d]
          set_property PACKAGE_PIN ${{ matrix.q }} [get_ports q]
          set_property IOSTANDARD LVCMOS33 [get_ports q]
          EOF
          cat work/top.v work/top.xdc

      - name: Build it, all the way to frames
        id: build
        run: |
          set +e
          docker run --rm -v "$PWD:/w" -w /w "$OPENXC7_IMAGE" bash -c '
            set -e
            cd /nextpnr-xilinx
            BB=$(find / -name bbasm -type f -perm -u+x 2>/dev/null | head -1)
            python3 xilinx/python/bbaexport.py --device ${{ matrix.part }} --bba /w/work/c.bba
            $BB -l /w/work/c.bba /w/work/chip.bin
          ' > out/chipdb.log 2>&1
          echo "chipdb_rc=$?" >> $GITHUB_OUTPUT

          docker run --rm -v "$PWD:/w" -w /w/work "$OPENXC7_IMAGE" bash -c '
            yosys -p "synth_xilinx -flatten -abc9 -arch xc7 -top top; write_json /w/out/d.json" top.v
          ' > out/synth.log 2>&1
          echo "synth_rc=$?" >> $GITHUB_OUTPUT

          docker run --rm -v "$PWD:/w" -w /w/work "$OPENXC7_IMAGE" bash -c '
            nextpnr-xilinx --chipdb /w/work/chip.bin --xdc top.xdc \
              --json /w/out/d.json --fasm /w/out/d.fasm
          ' > out/pnr.log 2>&1
          echo "pnr_rc=$?" >> $GITHUB_OUTPUT

          docker run --rm -v "$PWD:/w" -w /w "$OPENXC7_IMAGE" bash -c '
            source /prjxray/env/bin/activate
            fasm2frames --part ${{ matrix.part }} \
              --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 \
              /w/out/d.fasm > /w/out/d.frames
          ' > out/frames.log 2>&1
          echo "frames_rc=$?" >> $GITHUB_OUTPUT
          exit 0

      - name: Verdict, and whether the gate itself is sound
        run: |
          set +e
          say() { echo "$1" >> $GITHUB_STEP_SUMMARY; echo "$1"; }
          C=${{ steps.build.outputs.chipdb_rc }}
          S=${{ steps.build.outputs.synth_rc }}
          P=${{ steps.build.outputs.pnr_rc }}
          F=${{ steps.build.outputs.frames_rc }}

          say "## ${{ matrix.part }}"
          say ''
          say '| stage | rc |'
          say '|---|---|'
          say "| chipdb | $C |"
          say "| yosys | $S |"
          say "| nextpnr | $P |"
          say "| fasm2frames | $F |"
          say ''

          if [ "$C" != 0 ] || [ "$S" != 0 ]; then
            say '**Inconclusive.** chipdb or synthesis failed, so this says nothing'
            say 'about the part — it is the harness or the image.'
            say '```'
            tail -5 out/chipdb.log out/synth.log 2>/dev/null >> $GITHUB_STEP_SUMMARY
            say '```'
            exit 1
          fi

          if [ "$P" = 0 ] && [ "$F" = 0 ]; then RESULT=pass; else RESULT=fail; fi
          ERR=$(grep -ohE '(ERROR|FasmLookupError): .{0,70}' out/pnr.log out/frames.log 2>/dev/null | head -1)
          say "**Result: $RESULT** ${ERR:+— \`$ERR\`}"
          say ''

          # The gate checking itself. Expectations are pinned in the matrix so a
          # change in either direction is loud: a35t starting to pass means #154
          # is fixed and this line must be updated deliberately; a200t starting
          # to fail means a real regression on a part that works today.
          if [ "$RESULT" = "${{ matrix.expect }}" ]; then
            say "Matches the recorded expectation (\`${{ matrix.expect }}\`) — gate is sound."
            exit 0
          fi
          say "::error::expected \`${{ matrix.expect }}\`, got \`$RESULT\`"
          if [ "${{ matrix.expect }}" = fail ]; then
            say 'This part was failing and now builds. Either openXC7#154 is fixed —'
            say 'in which case update the expectation in this matrix and say so on'
            say 'the issue — or this gate has stopped testing what it claims.'
          else
            say 'A part that built yesterday no longer does. That is the regression'
            say 'this workflow exists to catch.'
          fi
          exit 1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: part-coverage-${{ matrix.part }}
          path: out
          retention-days: 90
