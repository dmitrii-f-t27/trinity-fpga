name: Decode RTL exhaustive verification

# Third regression gate: exhaustively verifies the DECODE RTL (all formats) against
# independent oracles (value-via-float + struct, regime-parse, formula-derived LNS)
# on any change to a decoder or the verifier. Complements gf-adder-ref-tb (compute
# core) and conformance-selftest (goldens). Catches decode bugs before they reach a
# bitstream (this is how the binary16 NaN-payload bug was caught pre-silicon).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'fpga/openxc7-synth/*_decode.v'
      - 'fpga/openxc7-synth/binary16_decode.v'
      - 'conformance/decode_verify.py'
      - 'formal/decode_tb.v'
      - 'formal/binary16_decode_tb.v'
      - 'formal/fp8_e5m2_decode_tb.v'
      - '.github/workflows/decode-verify.yml'
  pull_request:
    paths:
      - 'fpga/openxc7-synth/*_decode.v'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install iverilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Combined decode TB (7 formats)
        run: |
          set -e
          iverilog -g2012 -o /tmp/dec.vvp formal/decode_tb.v \
            fpga/openxc7-synth/fp8_e4m3_fnuz_decode.v fpga/openxc7-synth/fp6_e2m3_decode.v \
            fpga/openxc7-synth/fp6_e3m2_decode.v fpga/openxc7-synth/fp4_decode.v \
            fpga/openxc7-synth/int4_decode.v fpga/openxc7-synth/posit8_decode.v \
            fpga/openxc7-synth/lns8_decode.v
          vvp /tmp/dec.vvp | python3 conformance/decode_verify.py | tee /tmp/dec.out
          grep -q FAIL /tmp/dec.out && exit 1 || true
      - name: binary16 (exhaustive, struct 'e' oracle)
        run: |
          set -e
          iverilog -g2012 -o /tmp/b16.vvp formal/binary16_decode_tb.v fpga/openxc7-synth/binary16_decode.v
          vvp /tmp/b16.vvp | python3 conformance/decode_verify.py --format binary16
      - name: fp8_e5m2 (exhaustive)
        run: |
          set -e
          iverilog -g2012 -o /tmp/f8.vvp formal/fp8_e5m2_decode_tb.v fpga/openxc7-synth/fp8_e5m2_decode.v
          vvp /tmp/f8.vvp | python3 conformance/decode_verify.py --format fp8_e5m2
      - run: echo "ALL DECODE RTL EXHAUSTIVE VERIFICATION: PASS"
