name: Build Compute Bitstreams (Silicon Sprint Prep)
on:
  workflow_dispatch:
    inputs:
      formats:
        description: 'Formats (space-separated)'
        required: false
        default: 'gf4 gf8 gf16 gf32 bf16'
      ops:
        description: 'Operations (space-separated)'
        required: false
        default: 'add mul div sqrt quire'

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        format: [gf4, gf8, gf16, gf32, bf16]
        op: [add, mul, div, sqrt, quire]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Synthesize ${{ matrix.format }}_${{ matrix.op }}
        uses: docker://regymm/openxc7:latest
        with:
          args: >-
            bash -c "cd fpga/openxc7-synth &&
            yosys -p 'read_verilog gf_adder_param.v gf_mul_param.v gf_div_param.v gf_sqrt_param.v gf_quire_param.v corona_compute_${{ matrix.format }}_${{ matrix.op }}_ax7203.v;
            synth_xilinx -abc9 -arch xc7;
            write_json ${{ matrix.format }}_${{ matrix.op }}.json'
            && /prjxray/env/bin/fasm2frames --db-root /nextpnr-xilinx/xilinx/external/prjxray-db/artix7 --part xc7a200tfbg484-2 /dev/null /dev/null 2>/dev/null;
            echo 'synth done'"
      - name: Upload JSON
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.format }}_${{ matrix.op }}_synth
          path: fpga/openxc7-synth/${{ matrix.format }}_${{ matrix.op }}.json
