name: LUT Report (yosys + nextpnr)

on:
  push:
    branches: [main]
    paths:
      - 'fpga/openxc7-synth/gf_adder_param.v'
      - 'fpga/openxc7-synth/gf_mul_param.v'
      - '.github/workflows/lut-report.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fpga/openxc7-synth/gf_adder_param.v'
      - 'fpga/openxc7-synth/gf_mul_param.v'
  workflow_dispatch:

jobs:
  yosys-synth:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Synthesize via Docker (yosys 0.63 from openXC7 image)
        run: |
          mkdir -p lut_reports
          docker run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            regymm/openxc7:latest \
            bash -c '
              set -e
              mkdir -p /work/lut_reports

              echo "# Yosys Synthesis LUT Report (pre-P&R)" > /work/lut_reports/yosys_report.md
              echo "Generated: $(date -u)" >> /work/lut_reports/yosys_report.md
              echo "Tool: $(yosys -V)" >> /work/lut_reports/yosys_report.md
              echo "Flags: synth_xilinx -flatten -abc9 -nocarry [-nodsp] -arch xc7" >> /work/lut_reports/yosys_report.md
              echo "" >> /work/lut_reports/yosys_report.md
              echo "| Format | W | E | M | ADD LUT | MUL LUT |" >> /work/lut_reports/yosys_report.md
              echo "|--------|---|---|---|---------|---------|" >> /work/lut_reports/yosys_report.md

              cd /work/fpga/openxc7-synth

              for spec in GF4:1:2 GF8:3:4 GF12:4:7 GF14:5:8 GF16:6:9 GF20:7:12; do
                IFS=: read name eb mb <<< "$spec"
                w=$((1 + eb + mb))
                bias=$(((1 << (eb - 1)) - 1))

                # ADD
                cat > /tmp/add.v << EOV
              module top(input clk, input rst, input in_valid,
                  input [$w:0] in_a, input [$w:0] in_b, output in_ready,
                  output reg out_valid, output reg [$w:0] out_y, input out_ready);
                gf_adder_param #(.EXP_BITS($eb),.MANT_BITS($mb),.TOTAL($((w+1))),.BIAS($bias),.HAS_INF(0)) u(
                  .clk(clk),.rst(rst),.in_valid(in_valid),.in_a(in_a),.in_b(in_b),
                  .in_ready(in_ready),.out_valid(out_valid),.out_y(out_y),.out_ready(out_ready));
              endmodule
              EOV
                add_lut=$(yosys -p "read_verilog /tmp/add.v; read_verilog gf_adder_param.v; synth_xilinx -flatten -abc9 -nocarry -arch xc7; stat" 2>&1 | \
                  awk "/Printing statistics/{f=1} f&&/LUT[1-6]/{s+=\$1} f&&/MUXF[78]/{s+=\$1} f&&/^\$/{if(s>0)exit} END{print s+0}")

                # MUL
                cat > /tmp/mul.v << EOV
              module top(input clk, input rst, input in_valid,
                  input [$w:0] in_a, input [$w:0] in_b, output in_ready,
                  output reg out_valid, output reg [$w:0] out_y, input out_ready);
                gf_mul_param #(.EXP_BITS($eb),.MANT_BITS($mb),.TOTAL($((w+1))),.BIAS($bias),.HAS_INF(0)) u(
                  .clk(clk),.rst(rst),.in_valid(in_valid),.in_a(in_a),.in_b(in_b),
                  .in_ready(in_ready),.out_valid(out_valid),.out_y(out_y),.out_ready(out_ready));
              endmodule
              EOV
                mul_lut=$(yosys -p "read_verilog /tmp/mul.v; read_verilog gf_mul_param.v; synth_xilinx -flatten -abc9 -nocarry -nodsp -arch xc7; stat" 2>&1 | \
                  awk "/Printing statistics/{f=1} f&&/LUT[1-6]/{s+=\$1} f&&/MUXF[78]/{s+=\$1} f&&/^\$/{if(s>0)exit} END{print s+0}")

                echo "| $name | $((w+1)) | $eb | $mb | $add_lut | $mul_lut |" >> /work/lut_reports/yosys_report.md
                echo "  $name W=$((w+1)): ADD=$add_lut MUL=$mul_lut"
              done
              cat /work/lut_reports/yosys_report.md
            '

      - name: Upload yosys report
        uses: actions/upload-artifact@v4
        with:
          name: yosys-lut-report
          path: lut_reports/
