# ALINX AX7203 over AL321 — selecting ONE programmer when several are attached.
#
# Every AL321 cable in this set reports the same USB serial number
# ("210512180081"), so `ftdi serial` cannot tell them apart and openocd silently
# picks whichever it enumerates first. With three boards on the bus that means
# flashing a board you did not intend to.
#
# The only thing that distinguishes them is the USB bus path, so this config
# requires it. Pass it in:
#
#   sudo -n openocd -f fpga/openxc7-synth/ax7203_al321_multi.cfg \
#     -c "adapter usb location 0-1.4" \
#     -c "init" -c "pld load 0 <file.bit>" -c "runtest 2000" -c "shutdown"
#
# Find the live locations by sweeping — a valid board answers with IDCODE
# 0x13636093, an unconnected or unpowered one answers 0xffff.... :
#
#   for loc in 0-1.1 0-1.2 0-1.3 0-1.4 1-1.1 1-1.2 1-1.3 1-1.4; do ... done
#
# Note the locations move when hubs are added or removed, so sweep again after
# re-cabling rather than trusting a value from a previous session. A freshly
# plugged board can also read as 0xffff... for a few seconds before settling;
# re-run before concluding a programmer is dead.
#
# Everything below is identical to ax7203_al321.cfg.

adapter driver ftdi
ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none

transport select jtag

# TCK freq: 100 kHz is the only stable speed on this AL321 cable.
adapter speed 100

jtag newtap xc7 tap -irlen 6 -ignore-version \
	-expected-id 0x03636093 \
	-expected-id 0x13636093

pld device virtex2 xc7.tap 1

set XC7_JSHUTDOWN 0x0d
set XC7_JPROGRAM 0x0b
set XC7_JSTART 0x0c
set XC7_BYPASS 0x3f

proc xc7_program {tap} {
	global XC7_JSHUTDOWN XC7_JPROGRAM XC7_BYPASS
	irscan $tap $XC7_JSHUTDOWN
	irscan $tap $XC7_JPROGRAM
	runtest 60000
	irscan $tap $XC7_BYPASS
	runtest 2000
}
