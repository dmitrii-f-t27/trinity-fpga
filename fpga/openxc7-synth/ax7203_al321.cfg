# ALINX AX7203 OpenOCD configuration for AL321 USB-JTAG cable
# Verified: JTAG IDCODE 0x13636093 (Artix-7 XC7A200T-FBG484-2 rev 1)
# Cable: AL321 (FT2232H-based, Digilent JTAG-SMT2-NC compatible wiring)
#
# NOTE: The stock digilent_jtag_smt2.cfg layout hangs with this cable
# (mpsse_flush never completes). Use the SMT2-NC layout instead.

adapter driver ftdi
ftdi device_desc "Digilent USB Device"
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x00e8 0x60eb
reset_config none

transport select jtag

# TCK freq: 100 kHz is the only stable speed on this AL321 cable.
# Higher speeds (200+ kHz) produce garbage IDCODEs or MPSSE hangs.
adapter speed 100

# 7-series TAP: IR length 6, ignore revision nibble.
jtag newtap xc7 tap -irlen 6 -ignore-version \
	-expected-id 0x03636093 \
	-expected-id 0x13636093

pld device virtex2 xc7.tap 1

set XC7_JSHUTDOWN 0x0d
set XC7_JPROGRAM 0x0b
set XC7_JSTART 0x0c
set XC7_BYPASS 0x3f

# 7-series configuration programming sequence.
# JSTART is intentionally omitted: OpenOCD's virtex2 load already ends the
# bitstream with JSTART/start-up. Sending JSTART again can leave the FPGA
# in a non-user state (DONE stays dark). Matches stock cpld/xilinx-xc7.cfg.
# Usage: openocd -f fpga/openxc7-synth/ax7203_al321.cfg \
#            -c "init" \
#            -c "pld load 0 <file.bit>" \
#            -c "runtest 2000" \
#            -c "shutdown"
proc xc7_program {tap} {
	global XC7_JSHUTDOWN XC7_JPROGRAM XC7_BYPASS
	irscan $tap $XC7_JSHUTDOWN
	irscan $tap $XC7_JPROGRAM
	runtest 60000
	irscan $tap $XC7_BYPASS
	runtest 2000
}
